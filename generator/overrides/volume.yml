# Décisions humaines sur le produit `volume` (tag `Volume`).

operations:

  volume.v1.VolumeUpdateTask.ReadVolumeUpdateTasks:
    expose: false
    reason: >-
      feint 0.12.1 ne sert pas ReadVolumeUpdateTasks (mesuré sur son artefact
      de couverture, le 5 septembre 2026), et une tâche de mise à jour n'existe
      qu'après un UpdateVolume que la plateforme d'exemple n'envoie pas :
      aucune cible ne peut exercer le module tant que l'exemple ne tourne que
      contre l'émulateur.

  # ---- Un exemple que le contrat ne peut pas fournir seul -------------------
  #
  # Un exemple se copie, ou il n'apprend rien. La valeur d'exemple vient du
  # contrat quand il la porte (un enum), d'une convention de nom sinon ; ce
  # champ échappe aux deux, et la valeur se décide donc ici, avec sa source.
  volume.v1.Volume.UpdateVolume:
    parameters:
      VolumeType:
        example: gp2
        reason: >-
          Le contrat cite les trois valeurs dans sa phrase, « The new type of
          the volume (`standard` | `io1` | `gp2`) », sans les déclarer en enum :
          le repli par type publiait `volume_type: example-id`, copiable et
          refusé par l'API. `gp2` est celle des trois que la même phrase
          n'assortit d'aucune autre exigence (« If you update to an `io1`
          volume, you must also specify the `Iops` parameter »).
