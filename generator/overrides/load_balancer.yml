# Décisions humaines sur le produit `load_balancer` (tag `LoadBalancer`).
#
# feint 0.12.1 décline ces deux lectures (mesuré sur son artefact de
# couverture, le 5 septembre 2026). L'opération reste classée INFO et compte
# dans la couverture ; elle n'a pas de module tant que l'exemple ne peut pas
# la jouer.

operations:

  load_balancer.v1.LoadBalancerTag.ReadLoadBalancerTags:
    expose: false
    reason: >-
      feint 0.12.1 ne sert pas ReadLoadBalancerTags : aucune cible ne peut
      exercer le module tant que l'exemple ne tourne que contre l'émulateur.
      Les tags d'un load balancer se lisent aussi sur ReadLoadBalancers.

  load_balancer.v1.VmHealth.ReadVmsHealth:
    expose: false
    reason: >-
      feint 0.12.1 ne sert pas ReadVmsHealth, et la santé d'un backend n'existe
      que quand une sonde l'a mesurée : aucune cible ne peut exercer le module
      tant que l'exemple ne tourne que contre l'émulateur.
