---
# Les modules de la collection, appelés sur la plateforme d'exemple.
#
# **Aucun identifiant n'est écrit à la main.** Tout vient des sorties de la
# stack Terraform (`-e @plateforme-<run>.json`), de l'inventaire dynamique ou
# d'un module appelé plus haut. Un exemple qui code en dur un identifiant ne
# prouve ni l'inventaire ni les modules.
#
# **Tout module livré est appelé ici.** C'est la porte `coverage:check`, et sa
# liste d'exceptions est vide : ce que l'exemple ne peut pas jouer n'est pas
# généré. Le journal du plugin de rappel dit ensuite ce qui s'est réellement
# joué, et une route que feint déclinerait serait appelée sans être jouée.
#
# **Écrire puis réécrire.** Une écriture unique ne prouve aucune idempotence :
# `stop` et `accept` sont joués deux fois, et le compte des idempotences lit
# `changed` sur la seconde, il ne fait pas confiance aux assertions.

- name: Les modules de la collection, sur la plateforme que l'inventaire a découverte
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    web_b_id: "{{ vm_ids['web-b'] }}"
    app_id: "{{ vm_ids['app'] }}"

  tasks:
    # ---- Le parc, vu par les modules de lecture ----------------------------

    - name: Les machines de la plateforme, par leurs identifiants
      stephrobert.outscale.vm_info:
        filters:
          VmIds: "{{ vm_ids.values() | list }}"
      register: machines

    - name: L'API rend les trois machines que la plateforme a créées
      ansible.builtin.assert:
        that:
          - machines.vms | length == expected.total
          - machines is not changed
          - machines.vms | map(attribute='VmId') | sort == vm_ids.values() | sort
        quiet: true

    - name: Toutes les machines de la région, sans filtre
      stephrobert.outscale.vm_info:
      register: toutes

    - name: La liste sans filtre contient celles de la plateforme
      ansible.builtin.assert:
        that:
          - vm_ids.values() | difference(toutes.vms | map(attribute='VmId')) | length == 0
        quiet: true

    - name: Les types de machine
      stephrobert.outscale.vm_type_info:
      register: types

    - name: L'état des machines de la plateforme
      stephrobert.outscale.vm_state_info:
        filters:
          VmIds: "{{ vm_ids.values() | list }}"
      register: etats

    - name: Le mot de passe administrateur de la machine applicative
      stephrobert.outscale.vm_admin_password_info:
        vm_id: "{{ app_id }}"
      register: mot_de_passe
      no_log: true

    - name: La lecture rend l'identifiant de la machine interrogée
      ansible.builtin.assert:
        that:
          - mot_de_passe.admin_password.VmId == app_id
        quiet: true

    - name: Les volumes
      stephrobert.outscale.volume_info:
        filters:
          VolumeIds: "{{ volume_ids.values() | list }}"
      register: volumes

    - name: Deux volumes, dont celui attaché à la machine applicative
      ansible.builtin.assert:
        that:
          - volumes.volumes | length == 2
        quiet: true

    - name: L'instantané de l'image dorée
      stephrobert.outscale.snapshot_info:
        filters:
          SnapshotIds: ["{{ snapshot_id }}"]
      register: instantanes

    - name: L'image dorée
      stephrobert.outscale.image_info:
        filters:
          ImageIds: ["{{ image_id }}"]
      register: images

    - name: L'image est celle que la stack a bâtie depuis l'instantané
      ansible.builtin.assert:
        that:
          - instantanes.snapshots | length == 1
          - images.images | length == 1
          - images.images[0].ImageId == image_id
        quiet: true

    - name: La clé de la plateforme
      stephrobert.outscale.keypair_info:
        filters:
          KeypairNames: ["{{ keypair_name }}"]
      register: cles

    - name: Les deux Nets
      stephrobert.outscale.net_info:
        filters:
          NetIds: "{{ net_ids.values() | list }}"
      register: nets

    - name: Les sous-réseaux du Net workload
      stephrobert.outscale.subnet_info:
        filters:
          NetIds: ["{{ net_ids.workload }}"]
      register: sous_reseaux

    - name: Deux Nets, trois sous-réseaux dans workload
      ansible.builtin.assert:
        that:
          - cles.keypairs | length == 1
          - nets.nets | length == 2
          - sous_reseaux.subnets | length == 3
        quiet: true

    - name: Les groupes de sécurité, un par étage
      stephrobert.outscale.security_group_info:
        filters:
          SecurityGroupIds: "{{ security_group_ids.values() | list }}"
      register: groupes

    - name: Les adresses publiques de la plateforme
      stephrobert.outscale.public_ip_info:
        filters:
          PublicIpIds: "{{ public_ip_ids.values() | list }}"
      register: adresses

    - name: Les plages d'adresses publiques de la région
      stephrobert.outscale.public_ip_range_info:
      register: plages

    - name: L'interface créée à part, attachée à la machine applicative
      stephrobert.outscale.nic_info:
        filters:
          NicIds: ["{{ nic_id }}"]
      register: interfaces

    - name: L'interface est attachée à la machine applicative
      ansible.builtin.assert:
        that:
          - groupes.security_groups | length == 2
          - adresses.public_ips | length == 3
          - interfaces.nics | length == 1
          - interfaces.nics[0].LinkNic.VmId == app_id
        quiet: true

    - name: Les tables de routage
      stephrobert.outscale.route_table_info:
        filters:
          RouteTableIds: "{{ route_table_ids.values() | list }}"
      register: tables

    - name: Le service Internet
      stephrobert.outscale.internet_service_info:
        filters:
          InternetServiceIds: ["{{ internet_service_id }}"]
      register: igw

    - name: Le service NAT
      stephrobert.outscale.nat_service_info:
        filters:
          NatServiceIds: ["{{ nat_service_id }}"]
      register: nat

    - name: Le jeu d'options DHCP
      stephrobert.outscale.dhcp_option_info:
        filters:
          DhcpOptionsSetIds: ["{{ dhcp_options_set_id }}"]
      register: dhcp

    - name: Le plan de routage est celui de la stack
      ansible.builtin.assert:
        that:
          - tables.route_tables | length == 2
          - igw.internet_services | length == 1
          - nat.nat_services | length == 1
          - dhcp.dhcp_options | length == 1
        quiet: true

    - name: Le load balancer devant l'étage web
      stephrobert.outscale.load_balancer_info:
        filters:
          LoadBalancerNames: ["{{ load_balancer_name }}"]
      register: balanceurs

    - name: Il porte les deux machines web
      ansible.builtin.assert:
        that:
          - balanceurs.load_balancers | length == 1
          - balanceurs.load_balancers[0].BackendVmIds | sort == [vm_ids['web-a'], vm_ids['web-b']] | sort
        quiet: true

    - name: Les tags de la plateforme
      stephrobert.outscale.tag_info:
        filters:
          Keys: [exemple]
          Values: ["{{ prefix }}"]
      register: tags

    - name: Les trois machines portent le tag de ce run
      ansible.builtin.assert:
        that:
          - tags.tags | length == 3
        quiet: true

    - name: Les régions
      stephrobert.outscale.region_info:
      register: regions

    - name: Les sous-régions
      stephrobert.outscale.subregion_info:
      register: sous_regions

    - name: La région de la stack est déclarée, et ses sous-régions aussi
      ansible.builtin.assert:
        that:
          - region in (regions.regions | map(attribute='RegionName'))
          - subregions | difference(sous_regions.subregions | map(attribute='SubregionName')) | length == 0
        quiet: true

    # ---- Les actions : écrire, puis réécrire -------------------------------

    - name: Arrêter web-b
      stephrobert.outscale.vm_action:
        action: stop
        vm_ids: ["{{ web_b_id }}"]
      register: arret

    - name: L'arrêt a été envoyé, attendu, et la machine est arrêtée
      ansible.builtin.assert:
        that:
          - arret is changed
          - arret.states[web_b_id] == 'stopped'
        quiet: true

    - name: Arrêter web-b, une seconde fois
      stephrobert.outscale.vm_action:
        action: stop
        vm_ids: ["{{ web_b_id }}"]
      register: arret_bis

    - name: Démarrer web-b
      stephrobert.outscale.vm_action:
        action: start
        vm_ids: ["{{ web_b_id }}"]
      register: demarrage

    - name: Redémarrer web-b, qui tourne
      stephrobert.outscale.vm_action:
        action: reboot
        vm_ids: ["{{ web_b_id }}"]
      register: redemarrage

    - name: Démarrer, puis redémarrer, ont agi, et la machine tourne
      ansible.builtin.assert:
        that:
          - demarrage is changed
          - demarrage.states[web_b_id] == 'running'
          - redemarrage is changed
          - redemarrage.states[web_b_id] == 'running'
        quiet: true

    - name: Accepter le peering vers services
      stephrobert.outscale.net_peering_action:
        action: accept
        net_peering_id: "{{ net_peering_ids.to_services }}"
      register: acceptation

    - name: Accepter le peering vers services, une seconde fois
      stephrobert.outscale.net_peering_action:
        action: accept
        net_peering_id: "{{ net_peering_ids.to_services }}"
      register: acceptation_bis

    # `reject` n'est pas joué, et c'est mesuré : un peering refusé ne se
    # supprime plus (409 9029 `is rejected and cannot be deleted`, conforme à
    # la documentation de l'API), et refuser un peering que Terraform gère
    # rendait la destruction de la plateforme impossible.

    - name: Les peerings de la plateforme, relus
      stephrobert.outscale.net_peering_info:
        filters:
          NetPeeringIds: "{{ net_peering_ids.values() | list }}"
      register: peerings

    - name: Le peering est actif, et la lecture le confirme
      ansible.builtin.assert:
        that:
          - acceptation is changed
          - acceptation.states[net_peering_ids.to_services] == 'active'
          - peerings.net_peerings | length == 1
          - (peerings.net_peerings | selectattr('NetPeeringId', 'equalto', net_peering_ids.to_services) | first).State.Name == 'active'
        quiet: true

    # ---- La gestion d'état : lire, comparer, n'écrire que la différence ------
    #
    # Un module MANAGE qui enverrait son écriture à chaque passage ne serait
    # pas idempotent, quoi qu'affiche `changed`. Chaque réglage est donc écrit,
    # puis réécrit à l'identique : la seconde tâche doit rendre `changed=false`,
    # et c'est `changed` qui est lu, pas une assertion écrite à côté.

    - name: Protéger la machine applicative contre la suppression, en check mode
      stephrobert.outscale.vm:
        vm_id: "{{ app_id }}"
        deletion_protection: true
      check_mode: true
      register: protection_simulee

    - name: Protéger la machine applicative contre la suppression
      stephrobert.outscale.vm:
        vm_id: "{{ app_id }}"
        deletion_protection: true
      register: protection

    - name: La protéger une seconde fois
      stephrobert.outscale.vm:
        vm_id: "{{ app_id }}"
        deletion_protection: true
      register: protection_bis

    - name: Lever la protection, pour que Terraform puisse détruire la machine
      stephrobert.outscale.vm:
        vm_id: "{{ app_id }}"
        deletion_protection: false
      register: protection_levee

    - name: Le check mode annonce le changement sans l'envoyer, et la réécriture ne change rien
      ansible.builtin.assert:
        that:
          - protection_simulee is changed
          - protection is changed
          - protection.changes.deletion_protection.after == true
          - protection.vm.DeletionProtection == true
          - protection_bis is not changed
          - protection_levee is changed
        quiet: true

    - name: Agrandir le volume de données de la machine applicative
      stephrobert.outscale.volume:
        volume_id: "{{ volume_ids.app_data }}"
        size: 30
      register: agrandi

    - name: L'agrandir une seconde fois, à la même taille
      stephrobert.outscale.volume:
        volume_id: "{{ volume_ids.app_data }}"
        size: 30
      register: agrandi_bis

    - name: Le Net workload garde le jeu d'options DHCP que la plateforme lui a donné
      stephrobert.outscale.net:
        net_id: "{{ net_ids.workload }}"
        dhcp_options_set_id: "{{ dhcp_options_set_id }}"
      register: dhcp_inchange

    - name: Ouvrir l'adressage public du sous-réseau privé
      stephrobert.outscale.subnet:
        subnet_id: "{{ subnet_ids.private }}"
        map_public_ip_on_launch: true
      register: adressage

    - name: L'ouvrir une seconde fois
      stephrobert.outscale.subnet:
        subnet_id: "{{ subnet_ids.private }}"
        map_public_ip_on_launch: true
      register: adressage_bis

    - name: Le refermer
      stephrobert.outscale.subnet:
        subnet_id: "{{ subnet_ids.private }}"
        map_public_ip_on_launch: false
      register: adressage_ferme

    - name: Décrire l'image dorée
      stephrobert.outscale.image:
        image_id: "{{ image_id }}"
        description: "Golden image of run {{ prefix }}"
      register: image_decrite

    - name: La décrire une seconde fois
      stephrobert.outscale.image:
        image_id: "{{ image_id }}"
        description: "Golden image of run {{ prefix }}"
      register: image_decrite_bis

    - name: Décrire l'interface de la machine applicative
      stephrobert.outscale.nic:
        nic_id: "{{ nic_id }}"
        description: "Data plane of run {{ prefix }}"
      register: nic_decrite

    - name: La décrire une seconde fois
      stephrobert.outscale.nic:
        nic_id: "{{ nic_id }}"
        description: "Data plane of run {{ prefix }}"
      register: nic_decrite_bis

    - name: Régler la sonde de santé du load balancer
      stephrobert.outscale.load_balancer:
        load_balancer_name: "{{ load_balancer_name }}"
        health_check:
          CheckInterval: 10
          HealthyThreshold: 2
          Path: /healthz
          Port: 80
          Protocol: HTTP
          Timeout: 5
          UnhealthyThreshold: 5
      register: sonde

    - name: La régler une seconde fois
      stephrobert.outscale.load_balancer:
        load_balancer_name: "{{ load_balancer_name }}"
        health_check:
          CheckInterval: 10
          HealthyThreshold: 2
          Path: /healthz
          Port: 80
          Protocol: HTTP
          Timeout: 5
          UnhealthyThreshold: 5
      register: sonde_bis

    - name: Chaque réglage a été écrit une fois, relu tel quel, et sa réécriture n'a rien changé
      ansible.builtin.assert:
        that:
          - agrandi is changed and agrandi.volume.Size == 30
          - agrandi_bis is not changed
          - dhcp_inchange is not changed
          - adressage is changed and adressage.subnet.MapPublicIpOnLaunch == true
          - adressage_bis is not changed
          - adressage_ferme is changed
          - image_decrite is changed
          - image_decrite_bis is not changed
          - nic_decrite is changed
          - nic_decrite_bis is not changed
          - sonde is changed and sonde.load_balancer.HealthCheck.CheckInterval == 10
          - sonde_bis is not changed
        quiet: true

    # ---- Ce que ce run a prouvé, lu sur `changed`, pas sur des intentions --

    - name: Le compte des idempotences prouvées
      ansible.builtin.set_fact:
        idempotences_prouvees: >-
          {{ (['vm_action.stop'] if arret_bis is not changed else [])
             + (['net_peering_action.accept'] if acceptation_bis is not changed else [])
             + (['vm.deletion_protection'] if protection_bis is not changed else [])
             + (['volume.size'] if agrandi_bis is not changed else [])
             + (['net.dhcp_options_set_id'] if dhcp_inchange is not changed else [])
             + (['subnet.map_public_ip_on_launch'] if adressage_bis is not changed else [])
             + (['image.description'] if image_decrite_bis is not changed else [])
             + (['nic.description'] if nic_decrite_bis is not changed else [])
             + (['load_balancer.health_check'] if sonde_bis is not changed else []) }}
        non_emules: []

    - name: Les deux réécritures ont rendu changed=false
      ansible.builtin.assert:
        that:
          - arret_bis is not changed
          - acceptation_bis is not changed
        fail_msg: "une seconde écriture a rendu changed : l'idempotence n'est pas tenue"
        quiet: true
