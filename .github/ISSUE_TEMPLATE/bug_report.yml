name: A playbook did not behave
description: A module returned, changed or reported something the Outscale API did not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The one thing that helps most: **what Ansible printed.** This project's
        claim is that a generated module is the one an operator would have
        written by hand; a playbook that says otherwise is a fact, and it
        outranks any roadmap.

  - type: input
    id: module
    attributes:
      label: The module or plugin
      description: Its full name.
      placeholder: stephrobert.outscale.vm_info
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Collection version
      description: The output of `ansible-galaxy collection list stephrobert.outscale`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: ansible
    attributes:
      label: ansible-core version
      description: The first line of `ansible --version`.
      placeholder: ansible [core 2.18.1]
    validations:
      required: true

  - type: input
    id: sdk
    attributes:
      label: osc-sdk-python version
      description: The output of `pip show osc-sdk-python`. The SDK embeds its own copy of the contract, and refuses what that copy does not know.
      placeholder: 0.42.0
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: The task
      description: The smallest playbook that shows it. Redact identifiers, keep the shape.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What Ansible printed
      description: The output, ideally with `-vvv`. Redact access keys and secret keys; a key in an issue is a key to rotate.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: And, if you know it, what the API itself answers. `octl` or `osc-cli api` against the same resource settles most reports in one line, but mind that `osc-cli` has no dry-run mode.
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Against what
      options:
        - The real Outscale API
        - The feint emulator (OSC_ENDPOINT_API)
        - Both
    validations:
      required: true
