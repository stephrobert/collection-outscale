# Une nomenclature logicielle sur chaque poussée vers `main`.
#
# Elle documente ce que `main` contient entre deux états, ce qui est le moment
# où une dépendance apparaît réellement. Le workflow de publication, lui,
# attache l'archive de la collection à la release ; la nomenclature de `main`
# reste ici, comme artefact.
name: SBOM

on:
  push:
    branches: [main]

permissions: {}

jobs:
  main:
    name: Syft SBOM (main)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Anchore SBOM Action (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          output-file: collection-outscale.spdx.json
          artifact-name: collection-outscale.spdx.json
          upload-artifact: true
          upload-release-assets: false
