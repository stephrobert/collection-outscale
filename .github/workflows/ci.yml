# CI du générateur et de la collection. Aucun identifiant Outscale n'est
# nécessaire : le contrat est versionné, et rien ne va sur le réseau.
#
# Les étapes appellent les tâches de `mise.toml` plutôt que de recopier leurs
# commandes : une CI qui diverge du lanceur ne mesure pas ce qu'on croit.
#
# Trois règles tiennent la sécurité de ce fichier, et elles valent pour tous
# les workflows du dépôt :
#
# 1. **Aucun droit par défaut.** `permissions: {}` au niveau du workflow, puis
#    chaque job déclare le strict nécessaire. Un job qui n'a besoin de rien
#    n'obtient rien.
# 2. **Aucune action par tag.** Un tag est mobile : `@v4` est du code qui peut
#    changer sans revue, et c'est exactement le scénario tj-actions de mars
#    2025. Tout est épinglé par SHA de commit, avec la version en commentaire
#    pour que quarante caractères restent lisibles.
# 3. **Aucun jeton laissé derrière.** `persist-credentials: false` sur chaque
#    checkout : sans lui, `actions/checkout` laisse le `GITHUB_TOKEN` dans
#    `.git/config`, à portée de tout ce que la suite du job exécute.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # La CI tourne aussi sans changement : une dépendance qui casse toute seule
  # ne se voit pas autrement.
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

# Une pull request repoussée annule la série précédente. Sur `main`, rien n'est
# annulé : ce qui a été poussé doit avoir été mesuré.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generator:
    name: Générateur
    # Image épinglée plutôt que `ubuntu-latest` : une CI dont le socle change
    # sous elle ne dit pas si une régression vient du code ou de la machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # `audit` et non `block` : la politique se mesure avant de se
          # fermer. Une allowlist écrite sans avoir observé le trafic réel
          # casse la CI sans rien prouver.
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `version` épingle mise lui-même, sans quoi l'action télécharge la
      # dernière release publiée : mise installe Python et ruff et lance toutes
      # les tâches, donc le laisser flotter annulerait l'épinglage du reste.
      - name: Installer mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.2.23

      - name: Installer
        run: mise run setup

      # **Une seule commande, et c'est une correction.** Ce job recopiait huit
      # des douze tâches de `check`, et l'écart ne se voyait nulle part :
      # `lint:docs`, `matrix:check`, `coverage:check` et `package` n'étaient
      # joués que par d'autres jobs, ou par personne. Chez collection-scaleway,
      # la même liste tenue à la main a laissé passer une pull request verte
      # alors que le contrôle des compteurs sortait en 1 en local.
      #
      # `check` se décrit lui-même « ce qu'une pull request doit passer », et
      # le workflow de release l'appelle sous ce nom. Le job qui garde les
      # pull requests l'appelle donc aussi, plutôt que d'en tenir une seconde
      # liste qui diverge en silence. mise nomme chaque tâche dans le journal :
      # la granularité de lecture est conservée, c'est celle de l'oubli qui
      # disparaît.
      - name: Ce qu'une pull request doit passer
        run: mise run check

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports
          path: build/reports/
          if-no-files-found: warn

  collection:
    # Ce qu'Ansible dit du fichier produit : documentation, types, en-têtes,
    # import. Le travail du générateur n'est pas jugé par le générateur.
    #
    # La matrice couvre chaque version d'ansible-core que `meta/runtime.yml`
    # déclare supporter, de sa borne basse à la mineure que le verrou porte.
    # **Elle n'est pas recopiée** : `scripts/ansible_matrix.py` la dérive, et
    # `mise run matrix:check`, dans `check`, échoue dès que cette liste ou les
    # contextes du ruleset s'en écartent. Chez collection-exoscale, trois
    # endroits la tenaient à la main sans mécanisme de cohérence.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    name: collection (ansible-core ${{ matrix.ansible }})
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - ">=2.17,<2.18"
          - ">=2.18,<2.19"
          - ">=2.19,<2.20"
          - ">=2.20,<2.21"
          - ">=2.21,<2.22"
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.2.23

      - name: Installer
        run: mise run setup

      # La valeur de matrice passe par `env:` et non par une interpolation dans
      # le `run:` : une donnée interpolée directement dans un shell est une
      # injection de template, et c'est le premier défaut que zizmor cherche.
      - name: Épingler ansible-core
        env:
          ANSIBLE_CORE: ${{ matrix.ansible }}
        run: mise run setup:ansible

      # Le script refuse un vert obtenu sur zéro fichier examiné : sous une
      # arborescence que git ne suit pas, ansible-test saute toutes ses cibles
      # et sort en 0.
      - name: ansible-test sanity
        run: mise run sanity

      # L'outil officiel de documentation voit ce que sanity laisse passer :
      # sur une référence croisée invalide, sanity sort en 0 et lui en 3.
      - name: Documentation de la collection
        run: mise run lint:docs

  package:
    # L'archive installable, et la preuve qu'elle sert : contenu contrôlé
    # contre ce que `plugins/` porte sur le disque, installation réelle, puis
    # `ansible-doc` interrogé depuis la collection installée.
    name: Archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.2.23

      - name: Installer
        run: mise run setup

      - name: Construire et vérifier l'archive
        run: mise run package

      # Ce que les tâches construisent doit être ignoré par git. Un artefact
      # qui apparaît ici est un fichier que quelqu'un commitera sans le vouloir.
      - name: L'arbre de travail est resté propre
        run: mise run check:worktree

      - name: Publier l'archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection
          path: build/dist/*.tar.gz
          if-no-files-found: error

  exemple:
    # La plateforme d'exemple, contre l'émulateur : Terraform la bâtit avec le
    # fournisseur officiel, l'inventaire dynamique retrouve ce qu'elle a bâti,
    # le playbook appelle **chaque** module livré (la porte `coverage:check` n'a
    # aucune exception), puis tout est détruit et le contrôle de résidu compare
    # l'émulateur avant et après. C'est la seule preuve de comportement du
    # dépôt.
    #
    # **La cible réelle n'est pas ici et ne le sera pas.** Elle créerait des
    # ressources facturées sur le compte du mainteneur, et ne se lance qu'avec
    # son accord, demandé à chaque fois. Ce dépôt n'a jamais parlé au compte
    # Outscale réel.
    #
    # Ce que ce job ne prouve pas : ce que feint décline (136 routes sur 236),
    # qui n'est pas généré. L'artefact publié dit ce qui a réellement tourné.
    name: Plateforme d'exemple
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Durcir le runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Le job télécharge le binaire de l'émulateur : `audit` documente ce
          # trafic au lieu de le deviner.
          egress-policy: audit

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.2.23

      - name: Installer
        run: mise run setup

      # Épinglé par SHA : `v1` est une référence mobile. L'action télécharge le
      # binaire, contrôle sa somme SHA-256 contre `checksums.txt`, puis lance
      # `feint start`. Sur le port que `scripts/example.py` attend, qui n'est
      # ni le 4599 par défaut, ni le 4877 de collection-scaleway, ni le 4993 de
      # collection-exoscale. Le lanceur adopte un émulateur déjà en écoute et ne
      # l'arrête pas : le cycle de vie appartient à qui l'a démarré.
      - name: Démarrer l'émulateur
        uses: stephrobert/setup-feint@b7eba1d4fcaccf65cf9124bf97a0d995996709b9 # v1
        with:
          version: "0.12.1"
          addr: 127.0.0.1:4811

      - name: La plateforme d'exemple se bâtit, s'exploite et se détruit
        run: mise run example

      - name: Publier l'artefact de couverture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exemple
          path: build/example/*.json
          if-no-files-found: warn
