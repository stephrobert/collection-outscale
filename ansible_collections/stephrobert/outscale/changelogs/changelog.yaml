---
ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: 'First release of the generated Day-2 collection for the Outscale
        API: information modules for every resource the example platform touches,
        action modules for virtual machines and Net peerings, state modules that read
        a setting before writing it and report a change only when something differs,
        and a dynamic inventory plugin. Terraform provisions resources, this collection
        operates existing ones. Nothing here has been run against a real Outscale
        account yet: every module is exercised against the feint emulator on every
        pull request, and every setting is written twice to prove the second pass
        changes nothing.'
    fragments:
      - first-release.yml
    modules:
      - description: Gather information about Outscale dhcp options.
        name: dhcp_option_info
